# 热点监控关键词配置
# 只推送包含以下关键词的热点内容

keywords:
  # AI/科技类
  - "AI"
  - "人工智能"
  - "大模型"
  - "Sora"
  - "GPT"
  - "机器学习"
  
  # 财经/股市类
  - "股市"
  - "A 股"
  - "港股"
  - "美股"
  - "比特币"
  
  # 国际新闻类
  - "伊朗"
  - "以色列"
  - "中东"
  - "俄乌"
  
  # 互联网/科技公司
  - "腾讯"
  - "阿里"
  - "字节"
  - "华为"
  - "小米"

# 推送设置
push_settings:
  min_match: 1
  max_per_keyword: 3
  max_keywords: 10
